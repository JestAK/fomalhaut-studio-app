name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg zip
      - run: npm run check
      - run: npm test
      - run: for script in ops/*.sh; do bash -n "$script"; done
      - run: docker build -t fomalhaut-ci .
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: git archive --format=tar.gz HEAD -o release.tar.gz
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 7
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.sha }}
      - name: Deploy verified release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          digest=$(sha256sum release.tar.gz | cut -d ' ' -f 1)
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/fomalhaut-$GITHUB_SHA.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" "$digest" <<'REMOTE'
          set -euo pipefail
          umask 077
          release_sha=$1
          digest=$2
          [[ "$release_sha" =~ ^[a-f0-9]{40}$ && "$digest" =~ ^[a-f0-9]{64}$ ]]
          root="$HOME/fomalhaut-deploy"
          test -s "$root/shared.env"
          mkdir -p "$root/releases"
          exec 9>"$root/deploy.lock"
          flock -n 9
          archive="/tmp/fomalhaut-$release_sha.tar.gz"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          release=$(mktemp -d "$root/releases/$release_sha.XXXXXX")
          tar -xzf "$archive" --no-same-owner -C "$release"
          cp "$root/shared.env" "$release/.env"
          chmod 600 "$release/.env"
          cd "$release"
          sudo -n bash ops/update.sh
          if [[ -L "$root/current" ]]; then ln -sfn "$(readlink "$root/current")" "$root/previous"; fi
          ln -sfn "$release" "$root/current"
          rm -f "$archive"
          printf 'Deployed %s\n' "$release_sha"
          REMOTE
      - if: always()
        run: rm -f ~/.ssh/id_ed25519
